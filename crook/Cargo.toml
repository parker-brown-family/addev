[package]
name = "crook"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local agent-state bus: one writer, many displays. Answers 'which agent needs you' and draws nothing."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
strip = true
